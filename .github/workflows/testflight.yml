name: TestFlight

# Required GitHub Secrets:
#   BUILD_CERTIFICATE_BASE64       — Apple Distribution certificate as base64-encoded P12
#                                    (export from Keychain: right-click cert → Export → .p12, then: base64 -i cert.p12 | pbcopy)
#   P12_PASSWORD                   — password you set when exporting the P12
#   BUILD_PROVISION_PROFILE_BASE64 — App Store distribution provisioning profile as base64
#                                    (download from developer.apple.com, then: base64 -i profile.mobileprovision | pbcopy)
#   KEYCHAIN_PASSWORD              — any string, used for the temporary CI keychain
#   DEVELOPMENT_TEAM               — your 10-character Apple Team ID (e.g. ABC123DEF4)
#   APP_STORE_CONNECT_KEY_ID       — App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID    — App Store Connect API key issuer UUID
#   APP_STORE_CONNECT_API_KEY_BASE64 — .p8 API key file contents as base64
#                                      (base64 -i AuthKey_KEYID.p8 | pbcopy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: PROD

    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets are set
        run: |
          echo "BUILD_CERTIFICATE_BASE64 set: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}"
          echo "P12_PASSWORD set: ${{ secrets.P12_PASSWORD != '' }}"
          echo "BUILD_PROVISION_PROFILE_BASE64 set: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}"
          echo "DEVELOPMENT_TEAM set: ${{ secrets.DEVELOPMENT_TEAM != '' }}"
          echo "APP_STORE_CONNECT_KEY_ID set: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}"
          echo "APP_STORE_CONNECT_ISSUER_ID set: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}"
          echo "APP_STORE_CONNECT_API_KEY_BASE64 set: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}"

      - name: Import distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" ~/Library/Keychains/login.keychain-db /Library/Keychains/System.keychain
          echo "Keychain list:"
          security list-keychain -d user
          echo "Identities in CI keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          echo "Profile file size: $(wc -c < "$PP_PATH") bytes"
          UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$PP_PATH" | plutil -extract Name raw -)
          echo "Profile UUID: $UUID"
          echo "Profile Name: $NAME"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "Running as user: $(whoami), home: $HOME"
          echo "Profile UUID: $UUID"
          echo "Installed profiles:"
          ls ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "PP_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Set up App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Build archive
        run: |
          xcodebuild archive \
            -scheme Chanology \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Chanology.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/app-signing.keychain-db" \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            PROVISIONING_PROFILE="$PP_UUID" \
            CURRENT_PROJECT_VERSION="$(date +%s)"

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.DEVELOPMENT_TEAM }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.mcardle.chanology</key>
              <string>Github Actions profile</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Chanology.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Chanology.ipa" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Add build to Internal test group
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # Write the API key
          mkdir -p /tmp/asc_keys
          echo -n "$API_KEY_BASE64" | base64 --decode > /tmp/asc_keys/key.p8

          # Generate JWT
          HEADER=$(echo -n '{"alg":"ES256","kid":"'"$KEY_ID"'","typ":"JWT"}' | base64 | tr -d '=' | tr '/+' '_-' | tr -d '\n')
          NOW=$(date +%s)
          EXP=$((NOW + 1200))
          PAYLOAD=$(echo -n '{"iss":"'"$ISSUER_ID"'","iat":'"$NOW"',"exp":'"$EXP"',"aud":"appstoreconnect-v1"}' | base64 | tr -d '=' | tr '/+' '_-' | tr -d '\n')
          SIG=$(echo -n "$HEADER.$PAYLOAD" | openssl dgst -sha256 -sign /tmp/asc_keys/key.p8 -binary | base64 | tr -d '=' | tr '/+' '_-' | tr -d '\n')
          JWT="$HEADER.$PAYLOAD.$SIG"

          # Get app ID for io.mcardle.chanology
          APP_ID=$(curl -sf "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=io.mcardle.chanology" \
            -H "Authorization: Bearer $JWT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data'][0]['id'])")
          echo "App ID: $APP_ID"

          # Wait for build to appear (processing can take a minute)
          echo "Waiting for build to appear in ASC..."
          BUILD_ID=""
          for i in $(seq 1 20); do
            BUILD_ID=$(curl -sf "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=$APP_ID&sort=-uploadedDate&limit=1" \
              -H "Authorization: Bearer $JWT" | python3 -c "import sys,json; d=json.load(sys.stdin)['data']; print(d[0]['id']) if d else print('')")
            if [ -n "$BUILD_ID" ]; then break; fi
            echo "Attempt $i: build not yet visible, waiting 30s..."
            sleep 30
          done
          echo "Build ID: $BUILD_ID"

          # Get the Internal group ID
          GROUP_ID=$(curl -sf "https://api.appstoreconnect.apple.com/v1/apps/$APP_ID/betaGroups?filter[name]=Internal" \
            -H "Authorization: Bearer $JWT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data'][0]['id'])")
          echo "Group ID: $GROUP_ID"

          # Add build to group
          curl -sf -X POST "https://api.appstoreconnect.apple.com/v1/betaGroups/$GROUP_ID/relationships/builds" \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            -d '{"data":[{"type":"builds","id":"'"$BUILD_ID"'"}]}'

          echo "Build added to Internal group."
          rm -rf /tmp/asc_keys

      - name: Clean up keychain and secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build_pp.mobileprovision"
          rm -rf ~/.appstoreconnect/private_keys
