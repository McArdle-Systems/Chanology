name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, macOS]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          iphones = [
            d for devices in data['devices'].values()
            for d in devices
            if 'iPhone' in d['name'] and d['isAvailable']
          ]
          iphones.sort(key=lambda d: d['name'])
          print(iphones[-1]['udid'])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme Chanology \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            | xcpretty || xcodebuild test \
              -scheme Chanology \
              -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
